version: '3.8'

services:
  pastebin-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pastebin-platform
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - pastebin-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pastebin-data:
    driver: local
